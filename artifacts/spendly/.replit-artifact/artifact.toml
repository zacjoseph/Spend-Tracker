kind = "mobile"
previewPath = "/"
title = "Spendly"
description = "A quick, calm mobile spending tracker for logging recurring monthly bills and everyday purchases, with clear daily and monthly totals and on-device persistence."
version = "1.0.0"
id = "artifacts/spendly"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23663

[services.development]
run = "pnpm --filter @workspace/spendly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spendly", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/spendly", "run", "serve" ]

[services.env]
PORT = "23663"
BASE_PATH = "/"
